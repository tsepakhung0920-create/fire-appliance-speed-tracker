<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消防出勤測速與考核分析</title>
  
  <!-- 地圖核心 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 高相容性中文字體 PDF 產生庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

    /* 頂部即時核心儀表 */
    #top-bar {
      background: #1e293b;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      text-align: center;
      border-bottom: 2px solid #334155;
      z-index: 1000;
      flex-shrink: 0;
    }
    .kpi-title { font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .kpi-value { font-size: 15px; font-weight: bold; }
    .kpi-speed { font-size: 18px; color: #38bdf8; }

    /* 操作按鈕區 */
    #action-container {
      background: #0f172a;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid #334155;
      z-index: 1000;
      flex-shrink: 0;
    }
    .main-btn {
      width: 100%;
      padding: 13px 10px;
      font-size: 17px;
      font-weight: 800;
      border: 2px solid #34d399;
      border-radius: 8px;
      color: white;
      background: #059669;
      cursor: pointer;
    }
    .main-btn.active {
      background: #dc2626;
      border-color: #f87171;
    }
    #downloadPdfBtn {
      display: none;
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      background: #0284c7;
      border: 1px solid #38bdf8;
      color: #fff;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }
    #status-hint { font-size: 11px; text-align: center; color: #38bdf8; }

    /* 中間地圖 */
    #map-container { height: 32vh; width: 100%; position: relative; flex-shrink: 0; }
    #map { height: 100%; width: 100%; }

    /* 下方時間軸面板 */
    #stream-panel {
      flex: 1;
      background: #1e293b;
      overflow-y: auto;
      padding: 10px 12px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-title {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
      border-left: 3px solid #38bdf8;
      padding-left: 6px;
      margin-bottom: 6px;
    }
    .timeline-list { display: flex; flex-direction: column; gap: 6px; }
    .timeline-card {
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid #64748b;
    }
    .timeline-card.stop { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.08); }
    .timeline-card.run { border-left-color: #10b981; background: rgba(16, 185, 129, 0.08); }
    .time-badge { font-family: monospace; font-weight: bold; background: #334155; padding: 2px 5px; border-radius: 4px; }
    .loc-text { color: #cbd5e1; font-size: 12px; margin-top: 2px; }

    /* 隱藏專用：用來渲染成 A4 PDF 的整潔報告樣式 */
    #pdf-report-template {
      display: none;
      background: #ffffff;
      color: #111827;
      padding: 24px;
      font-family: sans-serif;
    }
    .pdf-header { border-bottom: 2px solid #b91c1c; padding-bottom: 10px; margin-bottom: 16px; }
    .pdf-title { font-size: 20px; font-weight: bold; color: #b91c1c; }
    .pdf-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .pdf-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .pdf-kpi-box { background: #f3f4f6; border-radius: 6px; padding: 10px; text-align: center; }
    .pdf-kpi-label { font-size: 11px; color: #4b5563; }
    .pdf-kpi-num { font-size: 16px; font-weight: bold; color: #111827; margin-top: 2px; }
    .pdf-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .pdf-table th { background: #f3f4f6; color: #374151; padding: 8px; border: 1px solid #e5e7eb; text-align: left; }
    .pdf-table td { padding: 8px; border: 1px solid #e5e7eb; }
  </style>
</head>
<body>

  <!-- 頂部即時核心儀表 -->
  <div id="top-bar">
    <div>
      <div class="kpi-title">即時時速</div>
      <div id="kpi-speed" class="kpi-value kpi-speed">0.0 <span style="font-size:10px;">km/h</span></div>
    </div>
    <div>
      <div class="kpi-title">累積距離</div>
      <div id="kpi-dist" class="kpi-value">0.00 <span style="font-size:10px;">km</span></div>
    </div>
    <div>
      <div class="kpi-title">累積耗時</div>
      <div id="kpi-total-time" class="kpi-value">00:00</div>
    </div>
    <div>
      <div class="kpi-title">受阻秒數</div>
      <div id="kpi-stop-time" class="kpi-value" style="color:#ef4444;">0s</div>
    </div>
  </div>

  <!-- 按鈕控制區 -->
  <div id="action-container">
    <button id="actionBtn" class="main-btn" onclick="toggleTracking()">出勤開始 (START)</button>
    <div id="status-hint"></div>
    <button id="downloadPdfBtn" onclick="generatePDF()">📄 重新下載 PDF 考核報告</button>
  </div>

  <!-- 地圖 -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <!-- 下方時間軸面板 -->
  <div id="stream-panel">
    <div>
      <div class="section-title">行車事件時間軸 (起步 - 停滯 - 重新開車)</div>
      <div id="timeline-box" class="timeline-list">
        <div style="color: #64748b; font-size: 11px;" id="empty-hint">按開始後，系統將自動記錄行車時間軸...</div>
      </div>
    </div>
  </div>

  <!-- 隱藏的 PDF 渲染容器 (供 html2pdf 轉換為標準 A4 繁體中文文件) -->
  <div id="pdf-report-template">
    <div class="pdf-header">
      <div class="pdf-title">消防車輛駕駛出勤 / 考核記錄報告</div>
      <div class="pdf-sub" id="pdf-meta">出勤時間：-</div>
    </div>

    <div class="pdf-kpi-grid">
      <div class="pdf-kpi-box">
        <div class="pdf-kpi-label">總耗時</div>
        <div class="pdf-kpi-num" id="pdf-time">00:00</div>
      </div>
      <div class="pdf-kpi-box">
        <div class="pdf-kpi-label">總行駛里程</div>
        <div class="pdf-kpi-num" id="pdf-dist">0.00 km</div>
      </div>
      <div class="pdf-kpi-box">
        <div class="pdf-kpi-label">最高時速</div>
        <div class="pdf-kpi-num" id="pdf-max">0.0 km/h</div>
      </div>
      <div class="pdf-kpi-box">
        <div class="pdf-kpi-label">受阻停滯 (&le;5km/h)</div>
        <div class="pdf-kpi-num" id="pdf-stop" style="color:#b91c1c;">0 秒 (0%)</div>
      </div>
    </div>

    <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #111827;">行車時間軸詳細清單</div>
    <table class="pdf-table">
      <thead>
        <tr>
          <th style="width: 15%;">累積時間</th>
          <th style="width: 35%;">行車狀態</th>
          <th style="width: 15%;">持續時長</th>
          <th style="width: 35%;">位置 / 街道名稱</th>
        </tr>
      </thead>
      <tbody id="pdf-timeline-rows">
        <!-- 自動填充 -->
      </tbody>
    </table>
  </div>

  <script>
    let map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let isTracking = false;
    let watchId = null;
    let secondTimer = null;

    let points = [];
    let totalDistanceMeters = 0;
    let maxSpeed = 0;
    let totalSeconds = 0;
    let stoppedTotalSeconds = 0;
    let startTimeFormatted = "";

    let currentState = 'IDLE'; 
    let stateStartSec = 0;
    let timelineEvents = [];

    function getSpeedColor(speed) {
      if (speed <= 5.0) return '#ef4444'; 
      if (speed <= 25.0) return '#f97316'; 
      if (speed <= 50.0) return '#eab308'; 
      if (speed <= 70.0) return '#22c55e'; 
      return '#3b82f6';                    
    }

    function formatTimeSec(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchStreetName(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=zh-TW,zh-HK`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.address) {
          return data.address.road || data.address.pedestrian || data.address.suburb || "未知路段";
        }
      } catch (e) {}
      return "未知路口";
    }

    function toggleTracking() {
      if (!isTracking) startTracking();
      else stopTracking();
    }

    function startTracking() {
      if (!navigator.geolocation) {
        alert('此設備不支援 GPS 定位');
        return;
      }

      points = [];
      totalDistanceMeters = 0;
      maxSpeed = 0;
      totalSeconds = 0;
      stoppedTotalSeconds = 0;
      timelineEvents = [];
      currentState = 'RUNNING';
      stateStartSec = 0;
      startTimeFormatted = new Date().toLocaleString('zh-HK');

      document.getElementById('timeline-box').innerHTML = '';
      document.getElementById('status-hint').innerText = '';
      document.getElementById('downloadPdfBtn').style.display = 'none';

      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});

      isTracking = true;
      const btn = document.getElementById('actionBtn');
      btn.innerText = '結束出勤並匯出 PDF';
      btn.className = 'main-btn active';

      addTimelineNode('RUNNING', 0, '起步開車', '出發點');

      let latestSpeed = 0;
      secondTimer = setInterval(() => {
        totalSeconds++;
        document.getElementById('kpi-total-time').innerText = formatTimeSec(totalSeconds);

        if (latestSpeed <= 5.0) {
          stoppedTotalSeconds++;
          document.getElementById('kpi-stop-time').innerText = stoppedTotalSeconds + 's';
        }
        updateCurrentNodeDuration(totalSeconds - stateStartSec);
      }, 1000);

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          
          let speed = pos.coords.speed !== null && pos.coords.speed >= 0 ? pos.coords.speed * 3.6 : 0;

          if (points.length > 0 && (pos.coords.speed === null || pos.coords.speed < 0)) {
            const last = points[points.length - 1];
            const dist = calcDistance(last.lat, last.lng, lat, lng);
            const dt = (pos.timestamp - last.time) / 1000;
            if (dt > 0) speed = (dist / dt) * 3.6;
          }

          latestSpeed = speed;
          if (speed > maxSpeed) maxSpeed = speed;

          document.getElementById('kpi-speed').innerHTML = `${speed.toFixed(1)} <span style="font-size:10px;">km/h</span>`;
          document.getElementById('kpi-speed').style.color = getSpeedColor(speed);

          if (speed <= 5.0 && currentState !== 'STOPPED') {
            currentState = 'STOPPED';
            stateStartSec = totalSeconds;
            
            const marker = L.circleMarker([lat, lng], {
              radius: 8, color: '#fff', weight: 2, fillColor: '#ef4444', fillOpacity: 0.95
            }).addTo(map);

            const node = addTimelineNode('STOPPED', totalSeconds, '車輛受阻停下 (<=5km/h)', '獲取街名中...');
            marker.bindPopup(`<b>停滯點 (${formatTimeSec(totalSeconds)})</b>`).openPopup();

            fetchStreetName(lat, lng).then(st => {
              node.street = st;
              const el = document.getElementById(`node-loc-${node.id}`);
              if (el) el.innerText = st;
              marker.setPopupContent(`<b>停滯點 (${formatTimeSec(node.startSec)})</b><br>${st}`);
            });

          } else if (speed > 5.0 && currentState !== 'RUNNING') {
            currentState = 'RUNNING';
            stateStartSec = totalSeconds;

            const node = addTimelineNode('RUNNING', totalSeconds, '繼續開車 (恢復速度)', '獲取街名中...');
            fetchStreetName(lat, lng).then(st => {
              node.street = st;
              const el = document.getElementById(`node-loc-${node.id}`);
              if (el) el.innerText = st;
            });
          }

          if (points.length > 0) {
            const last = points[points.length - 1];
            const segDist = calcDistance(last.lat, last.lng, lat, lng);
            totalDistanceMeters += segDist;
            document.getElementById('kpi-dist').innerHTML = `${(totalDistanceMeters / 1000).toFixed(2)} <span style="font-size:10px;">km</span>`;

            L.polyline([[last.lat, last.lng], [lat, lng]], {
              color: getSpeedColor((last.speed + speed) / 2),
              weight: 6,
              opacity: 0.85
            }).addTo(map);
          }

          points.push({ lat, lng, speed, time: pos.timestamp });
          map.setView([lat, lng]);
        },
        (err) => console.error(err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function stopTracking() {
      isTracking = false;
      if (watchId) navigator.geolocation.clearWatch(watchId);
      if (secondTimer) clearInterval(secondTimer);

      const btn = document.getElementById('actionBtn');
      btn.innerText = '出勤開始 (START)';
      btn.className = 'main-btn';
      
      document.getElementById('downloadPdfBtn').style.display = 'block';
      document.getElementById('status-hint').innerText = '📄 正在產生高畫質 PDF 報告...';

      // 立即生成 PDF
      setTimeout(() => {
        generatePDF();
      }, 500);
    }

    function addTimelineNode(type, sec, title, street) {
      const id = timelineEvents.length + 1;
      const nodeObj = { id, type, startSec: sec, duration: 1, title, street };
      timelineEvents.push(nodeObj);

      const box = document.getElementById('timeline-box');
      const card = document.createElement('div');
      card.className = `timeline-card ${type === 'STOPPED' ? 'stop' : 'run'}`;
      card.id = `node-card-${id}`;
      card.innerHTML = `
        <div>
          <div><span class="time-badge">${formatTimeSec(sec)}</span> <b>${title}</b></div>
          <div class="loc-text" id="node-loc-${id}">${street}</div>
        </div>
        <div style="font-weight:bold; font-size:13px;" id="node-dur-${id}">1s</div>
      `;
      box.prepend(card);
      return nodeObj;
    }

    function updateCurrentNodeDuration(dur) {
      if (timelineEvents.length === 0) return;
      const last = timelineEvents[timelineEvents.length - 1];
      last.duration = dur;
      const el = document.getElementById(`node-dur-${last.id}`);
      if (el) el.innerText = `${dur}s`;
    }

    // 將資料填入隱藏模板並導出 PDF
    function generatePDF() {
      const distKm = (totalDistanceMeters / 1000).toFixed(2);
      const stoppedPercent = totalSeconds > 0 ? ((stoppedTotalSeconds / totalSeconds) * 100).toFixed(1) + "%" : "0%";

      // 填寫 PDF 模板內容
      document.getElementById('pdf-meta').innerText = `出勤記錄時間：${startTimeFormatted} ｜ 產生時間：${new Date().toLocaleString('zh-HK')}`;
      document.getElementById('pdf-time').innerText = formatTimeSec(totalSeconds);
      document.getElementById('pdf-dist').innerText = `${distKm} km`;
      document.getElementById('pdf-max').innerText = `${maxSpeed.toFixed(1)} km/h`;
      document.getElementById('pdf-stop').innerText = `${stoppedTotalSeconds} 秒 (${stoppedPercent})`;

      const tbody = document.getElementById('pdf-timeline-rows');
      tbody.innerHTML = '';
      timelineEvents.forEach(e => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-family:monospace; font-weight:bold;">${formatTimeSec(e.startSec)}</td>
          <td style="color:${e.type === 'STOPPED' ? '#b91c1c' : '#059669'}; font-weight:bold;">${e.title}</td>
          <td>${e.duration} 秒</td>
          <td>${e.street || "市區路段"}</td>
        `;
        tbody.appendChild(tr);
      });

      // 暫時顯示模板進行截圖轉化
      const element = document.getElementById('pdf-report-template');
      element.style.display = 'block';

      const opt = {
        margin:       [10, 10, 10, 10],
        filename:     `消防出勤考核報告_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        element.style.display = 'none'; // 隱藏回模板
        document.getElementById('status-hint').innerText = '✅ PDF 考核報告已成功下載！';
      });
    }
  </script>
</body>
</html>
