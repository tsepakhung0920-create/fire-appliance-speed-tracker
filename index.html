<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>消防出勤測速與考試記錄</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

    /* 1. 頂部即時核心儀表 */
    #top-bar {
      background: #1e293b;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      text-align: center;
      border-bottom: 2px solid #334155;
      z-index: 1000;
      flex-shrink: 0;
    }
    .kpi-title { font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .kpi-value { font-size: 15px; font-weight: bold; }
    .kpi-speed { font-size: 18px; color: #38bdf8; }

    /* 2. 操作按鈕區：放在頂部核心位置，絕不會被遮擋 */
    #action-container {
      background: #0f172a;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #334155;
      z-index: 1000;
      flex-shrink: 0;
    }
    .main-btn {
      flex: 1;
      padding: 14px 10px;
      font-size: 18px;
      font-weight: 800;
      border: 2px solid #34d399;
      border-radius: 8px;
      color: white;
      background: #059669;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
    }
    .main-btn.active {
      background: #dc2626;
      border-color: #f87171;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
    }
    #downloadBtn {
      display: none; /* 結束後顯示 */
      flex: 0.7;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      cursor: pointer;
    }

    /* 3. 中間地圖 */
    #map-container { height: 35vh; width: 100%; position: relative; flex-shrink: 0; }
    #map { height: 100%; width: 100%; }

    /* 4. 下方直流分段數據面板 */
    #stream-panel {
      flex: 1;
      background: #1e293b;
      overflow-y: auto;
      padding: 10px 12px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
      border-left: 3px solid #38bdf8;
      padding-left: 6px;
      margin-bottom: 4px;
    }

    /* 各速度區間行車時間表格 */
    .speed-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .speed-table th { color: #64748b; text-align: left; padding: 4px 6px; font-weight: normal; }
    .speed-table td { padding: 4px 6px; border-top: 1px solid #334155; }
    .badge { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

    /* 停滯地點清單 */
    #stop-list { display: flex; flex-direction: column; gap: 6px; }
    .stop-item {
      background: #0f172a;
      border-left: 4px solid #ef4444;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .stop-item-title { font-weight: bold; color: #f8fafc; font-size: 12px; }
    .stop-item-time { color: #94a3b8; font-size: 10px; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- 1. 頂部儀表 -->
  <div id="top-bar">
    <div>
      <div class="kpi-title">即時時速</div>
      <div id="kpi-speed" class="kpi-value kpi-speed">0.0 <span style="font-size:10px;">km/h</span></div>
    </div>
    <div>
      <div class="kpi-title">總距離</div>
      <div id="kpi-dist" class="kpi-value">0.00 <span style="font-size:10px;">km</span></div>
    </div>
    <div>
      <div class="kpi-title">總時長</div>
      <div id="kpi-total-time" class="kpi-value">00:00</div>
    </div>
    <div>
      <div class="kpi-title">最高時速</div>
      <div id="kpi-max-speed" class="kpi-value">0.0</div>
    </div>
  </div>

  <!-- 2. 開始 / 結束大按鈕 (保證直接看見) -->
  <div id="action-container">
    <button id="actionBtn" class="main-btn" onclick="toggleTracking()">出勤開始 (START)</button>
    <button id="downloadBtn" onclick="exportToExcel()">下載 Excel</button>
  </div>

  <!-- 3. 地圖區域 -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <!-- 4. 下方直流數據面板 -->
  <div id="stream-panel">
    
    <!-- 各速度區間時間統計 -->
    <div>
      <div class="section-title">各速度區間時間統計 (直流分析)</div>
      <table class="speed-table">
        <thead>
          <tr>
            <th>速度等級</th>
            <th>累計時間</th>
            <th>時間佔比</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="badge" style="background:#ef4444;"></span>&le; 5 km/h (停車/受阻)</td>
            <td id="t-stop" style="color:#ef4444; font-weight:bold;">0 秒</td>
            <td id="p-stop">0%</td>
          </tr>
          <tr>
            <td><span class="badge" style="background:#f97316;"></span>5 - 25 km/h (慢行)</td>
            <td id="t-slow">0 秒</td>
            <td id="p-slow">0%</td>
          </tr>
          <tr>
            <td><span class="badge" style="background:#eab308;"></span>25 - 50 km/h (市區巡航)</td>
            <td id="t-med">0 秒</td>
            <td id="p-med">0%</td>
          </tr>
          <tr>
            <td><span class="badge" style="background:#22c55e;"></span>50 - 70 km/h (快速)</td>
            <td id="t-fast">0 秒</td>
            <td id="p-fast">0%</td>
          </tr>
          <tr>
            <td><span class="badge" style="background:#3b82f6;"></span>> 70 km/h (高速暢通)</td>
            <td id="t-vfast">0 秒</td>
            <td id="p-vfast">0%</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 低於 5 公里的停車地點清單 -->
    <div>
      <div class="section-title">受阻街道記錄 (&le;5 km/h 自動辨識街名)</div>
      <div id="stop-list">
        <div style="color: #64748b; font-size: 11px; padding: 4px 0;" id="empty-hint">暫無停車受阻記錄</div>
      </div>
    </div>

  </div>

  <script>
    let map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let isTracking = false;
    let watchId = null;
    let secondTimer = null;

    let points = [];
    let totalDistanceMeters = 0;
    let maxSpeed = 0;
    let totalSeconds = 0;
    let startTimeFormatted = "";

    let speedBuckets = { stop: 0, slow: 0, med: 0, fast: 0, vfast: 0 };
    let currentStopEvent = null; 
    let stopEventIndex = 1;
    let allStopEvents = [];

    function getSpeedColor(speed) {
      if (speed <= 5.0) return '#ef4444'; 
      if (speed <= 25.0) return '#f97316'; 
      if (speed <= 50.0) return '#eab308'; 
      if (speed <= 70.0) return '#22c55e'; 
      return '#3b82f6';                    
    }

    function formatTime(totalSec) {
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchStreetName(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=zh-TW,zh-HK`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.address) {
          return data.address.road || data.address.pedestrian || data.address.suburb || "未知路段";
        }
      } catch (e) {
        console.error("街名查詢失敗:", e);
      }
      return "未知路口";
    }

    function toggleTracking() {
      if (!isTracking) startTracking();
      else stopTracking();
    }

    function startTracking() {
      if (!navigator.geolocation) {
        alert('此設備不支援 GPS 定位');
        return;
      }

      points = [];
      totalDistanceMeters = 0;
      maxSpeed = 0;
      totalSeconds = 0;
      stopEventIndex = 1;
      currentStopEvent = null;
      allStopEvents = [];
      speedBuckets = { stop: 0, slow: 0, med: 0, fast: 0, vfast: 0 };
      startTimeFormatted = new Date().toLocaleString('zh-HK');

      document.getElementById('stop-list').innerHTML = '';
      document.getElementById('downloadBtn').style.display = 'none';

      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});

      isTracking = true;
      const btn = document.getElementById('actionBtn');
      btn.innerText = '結束出勤 (STOP)';
      btn.className = 'main-btn active';

      let latestSpeed = 0;
      secondTimer = setInterval(() => {
        totalSeconds++;
        document.getElementById('kpi-total-time').innerText = formatTime(totalSeconds);

        if (latestSpeed <= 5.0) speedBuckets.stop++;
        else if (latestSpeed <= 25.0) speedBuckets.slow++;
        else if (latestSpeed <= 50.0) speedBuckets.med++;
        else if (latestSpeed <= 70.0) speedBuckets.fast++;
        else speedBuckets.vfast++;

        updateBucketUI();

        if (latestSpeed <= 5.0 && currentStopEvent) {
          currentStopEvent.duration++;
          currentStopEvent.marker.setPopupContent(
            `<b>📍 ${currentStopEvent.streetName} (#${currentStopEvent.id})</b><br>` +
            `時間: ${currentStopEvent.startTime}<br>` +
            `受阻持續: <b style="color:red">${currentStopEvent.duration} 秒</b>`
          );
          updateStopItemUI(currentStopEvent);
        }
      }, 1000);

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          
          let speed = pos.coords.speed !== null && pos.coords.speed >= 0 ? pos.coords.speed * 3.6 : 0;

          if (points.length > 0 && (pos.coords.speed === null || pos.coords.speed < 0)) {
            const last = points[points.length - 1];
            const dist = calcDistance(last.lat, last.lng, lat, lng);
            const dt = (pos.timestamp - last.time) / 1000;
            if (dt > 0) speed = (dist / dt) * 3.6;
          }

          latestSpeed = speed;
          if (speed > maxSpeed) maxSpeed = speed;

          document.getElementById('kpi-speed').innerHTML = `${speed.toFixed(1)} <span style="font-size:10px;">km/h</span>`;
          document.getElementById('kpi-speed').style.color = getSpeedColor(speed);
          document.getElementById('kpi-max-speed').innerText = maxSpeed.toFixed(1);

          if (speed <= 5.0) {
            if (!currentStopEvent) {
              const now = new Date();
              const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
              
              const marker = L.circleMarker([lat, lng], {
                radius: 8, color: '#fff', weight: 2, fillColor: '#ef4444', fillOpacity: 0.95
              }).addTo(map);

              const eventId = stopEventIndex++;
              currentStopEvent = {
                id: eventId,
                lat, lng,
                startTime: timeStr,
                duration: 1,
                streetName: "正在辨識街道...",
                marker: marker
              };

              allStopEvents.push(currentStopEvent);
              marker.bindPopup(`<b>📍 正在辨識街道... (#${eventId})</b><br>時間: ${timeStr}<br>受阻持續: 1 秒`).openPopup();
              addStopItemToPanel(currentStopEvent);

              fetchStreetName(lat, lng).then((street) => {
                if (currentStopEvent && currentStopEvent.id === eventId) {
                  currentStopEvent.streetName = street;
                  currentStopEvent.marker.setPopupContent(
                    `<b>📍 ${street} (#${eventId})</b><br>` +
                    `時間: ${timeStr}<br>` +
                    `受阻持續: <b style="color:red">${currentStopEvent.duration} 秒</b>`
                  );
                }
                const titleEl = document.getElementById(`stop-ui-title-${eventId}`);
                if (titleEl) titleEl.innerText = `${street} (#${eventId})`;
              });
            }
          } else {
            currentStopEvent = null;
          }

          if (points.length > 0) {
            const last = points[points.length - 1];
            const segDist = calcDistance(last.lat, last.lng, lat, lng);
            totalDistanceMeters += segDist;
            document.getElementById('kpi-dist').innerHTML = `${(totalDistanceMeters / 1000).toFixed(2)} <span style="font-size:10px;">km</span>`;

            L.polyline([[last.lat, last.lng], [lat, lng]], {
              color: getSpeedColor((last.speed + speed) / 2),
              weight: 6,
              opacity: 0.85
            }).addTo(map);
          }

          points.push({ lat, lng, speed, time: pos.timestamp });
          map.setView([lat, lng]);
        },
        (err) => console.error(err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function stopTracking() {
      isTracking = false;
      if (watchId) navigator.geolocation.clearWatch(watchId);
      if (secondTimer) clearInterval(secondTimer);

      const btn = document.getElementById('actionBtn');
      btn.innerText = '出勤開始 (START)';
      btn.className = 'main-btn';
      document.getElementById('downloadBtn').style.display = 'block'; // 顯示下載按鈕
      currentStopEvent = null;

      // 自動觸發下載 Excel
      exportToExcel();
    }

    function exportToExcel() {
      const distKm = (totalDistanceMeters / 1000).toFixed(2);
      const totalTimeStr = formatTime(totalSeconds);
      const stoppedPercent = totalSeconds > 0 ? ((speedBuckets.stop / totalSeconds) * 100).toFixed(1) + "%" : "0%";
      const stopDetailsStr = allStopEvents.map(e => `${e.streetName}(${e.duration}秒)`).join("； ") || "無受阻記錄";

      const headers = ["出勤日期時間", "出勤總時長", "總里程(km)", "最高時速(km/h)", "受阻總秒數(<=5km/h)", "受阻時間佔比", "受阻街道詳細記錄"];
      const row = [
        `"${startTimeFormatted}"`,
        `"${totalTimeStr}"`,
        `"${distKm}"`,
        `"${maxSpeed.toFixed(1)}"`,
        `"${speedBuckets.stop} 秒"`,
        `"${stoppedPercent}"`,
        `"${stopDetailsStr}"`
      ];

      const csvContent = "\uFEFF" + headers.join(",") + "\n" + row.join(",");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      const dateTag = new Date().toISOString().slice(0,10);
      link.setAttribute("href", url);
      link.setAttribute("download", `消防出勤記錄_${dateTag}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function updateBucketUI() {
      const total = totalSeconds > 0 ? totalSeconds : 1;
      document.getElementById('t-stop').innerText = `${speedBuckets.stop} 秒`;
      document.getElementById('p-stop').innerText = `${((speedBuckets.stop / total) * 100).toFixed(0)}%`;
      document.getElementById('t-slow').innerText = `${speedBuckets.slow} 秒`;
      document.getElementById('p-slow').innerText = `${((speedBuckets.slow / total) * 100).toFixed(0)}%`;
      document.getElementById('t-med').innerText = `${speedBuckets.med} 秒`;
      document.getElementById('p-med').innerText = `${((speedBuckets.med / total) * 100).toFixed(0)}%`;
      document.getElementById('t-fast').innerText = `${speedBuckets.fast} 秒`;
      document.getElementById('p-fast').innerText = `${((speedBuckets.fast / total) * 100).toFixed(0)}%`;
      document.getElementById('t-vfast').innerText = `${speedBuckets.vfast} 秒`;
      document.getElementById('p-vfast').innerText = `${((speedBuckets.vfast / total) * 100).toFixed(0)}%`;
    }

    function addStopItemToPanel(stopEvt) {
      const container = document.getElementById('stop-list');
      const item = document.createElement('div');
      item.className = 'stop-item';
      item.id = `stop-ui-${stopEvt.id}`;
      item.innerHTML = `
        <div>
          <div class="stop-item-title" id="stop-ui-title-${stopEvt.id}">${stopEvt.streetName} (#${stopEvt.id})</div>
          <div class="stop-item-time">發生時間: ${stopEvt.startTime}</div>
        </div>
        <div style="font-weight:bold; color:#ef4444;" id="stop-ui-dur-${stopEvt.id}">1s</div>
      `;
      item.onclick = () => {
        map.setView([stopEvt.lat, stopEvt.lng], 17);
        stopEvt.marker.openPopup();
      };
      container.prepend(item);
    }

    function updateStopItemUI(stopEvt) {
      const el = document.getElementById(`stop-ui-dur-${stopEvt.id}`);
      if (el) el.innerText = `${stopEvt.duration}s`;
    }
  </script>
</body>
</html>
